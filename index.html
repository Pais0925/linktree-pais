<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Paisal Ramadan</title>
    <style>
        :root {
            --bg: #082f1e;
            --bg-mid: #0d3d28;
            --card-bg: #ffffff;
            --accent: #34d399;
            --radius-card: 14px;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
            background: radial-gradient(ellipse at top, #0f4a2f 0%, #082f1e 60%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            padding: 0 16px 48px;
        }

        .container {
            width: 100%;
            max-width: 420px;
        }

        /* ── Header ── */
        .header {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 40px 0 28px;
            gap: 14px;
        }

        .logo-ring {
            padding: 3px;
            border-radius: 50%;
            background: linear-gradient(135deg, #34d399, #059669, #065f46);
            box-shadow: 0 0 32px rgba(52, 211, 153, 0.35);
        }

        .logo {
            width: 86px;
            height: 86px;
            border-radius: 50%;
            background: linear-gradient(145deg, #064e35, #0a6644);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 30px;
            font-weight: 900;
            color: #34d399;
            letter-spacing: -1px;
            border: 3px solid #082f1e;
            overflow: hidden;
        }

        .logo img { width: 100%; height: 100%; object-fit: cover; border-radius: 50%; }

        .header-text { text-align: center; }

        .title {
            font-size: 18px;
            font-weight: 700;
            color: #f0fdf4;
            margin-bottom: 6px;
            line-height: 1.3;
        }

        .subtitle {
            font-size: 13px;
            color: #6ee7b7;
            line-height: 1.5;
        }

        .github-link {
            font-size: 12px;
            color: rgba(110, 231, 183, 0.7);
            text-decoration: none;
            margin-top: 2px;
            display: inline-block;
            transition: color 0.2s;
        }
        .github-link:hover { color: #34d399; }

        /* ── Social Row ── */
        .social-row {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-bottom: 28px;
        }

        .social-icon {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: rgba(255,255,255,0.08);
            border: 1px solid rgba(255,255,255,0.12);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            text-decoration: none;
            color: white;
            transition: background 0.2s, transform 0.2s, border-color 0.2s;
        }

        .social-icon:hover {
            background: rgba(52,211,153,0.18);
            border-color: rgba(52,211,153,0.4);
            transform: translateY(-2px);
        }

        .social-icon:active { transform: scale(0.92); }
        .social-icon svg { width: 17px; height: 17px; fill: #d1fae5; }

        /* ── Link Cards ── */
        .links-section {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .link-card {
            background: var(--card-bg);
            border-radius: var(--radius-card);
            padding: 12px 14px;
            display: flex;
            align-items: center;
            gap: 13px;
            cursor: pointer;
            box-shadow: 0 2px 16px rgba(0,0,0,0.25), 0 1px 4px rgba(0,0,0,0.15);
            transition: transform 0.15s ease, box-shadow 0.15s ease;
            border: none;
            width: 100%;
            text-align: left;
            text-decoration: none;
        }

        .link-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 24px rgba(0,0,0,0.3);
        }

        .link-card:active {
            transform: scale(0.975);
            box-shadow: 0 1px 8px rgba(0,0,0,0.2);
        }

        .link-thumb {
            width: 46px;
            height: 46px;
            border-radius: 10px;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
        }

        .link-info { flex: 1; min-width: 0; }

        .link-title {
            font-size: 13.5px;
            font-weight: 600;
            color: #111827;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            line-height: 1.3;
            margin-bottom: 4px;
        }

        .link-label {
            font-size: 10px;
            font-weight: 600;
            color: #6b7280;
            background: #f3f4f6;
            border-radius: 4px;
            padding: 2px 7px;
            display: inline-block;
            letter-spacing: 0.3px;
            text-transform: uppercase;
        }

        .menu-btn {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: transparent;
            border: none;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #9ca3af;
            transition: background 0.15s, color 0.15s;
            flex-shrink: 0;
        }

        .menu-btn:hover { background: #f3f4f6; color: #374151; }
        .menu-btn svg { width: 18px; height: 18px; fill: currentColor; }

        /* ── Modal Overlay ── */
        .overlay {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.55);
            backdrop-filter: blur(2px);
            z-index: 100;
            display: flex;
            align-items: flex-end;
            justify-content: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.28s ease;
        }

        .overlay.open {
            opacity: 1;
            pointer-events: all;
        }

        /* ── Share Sheet ── */
        .share-sheet {
            background: #ffffff;
            width: 100%;
            max-width: 420px;
            border-radius: 24px 24px 0 0;
            padding: 12px 20px 36px;
            transform: translateY(100%);
            transition: transform 0.32s cubic-bezier(0.32, 1.2, 0.64, 1);
        }

        .overlay.open .share-sheet {
            transform: translateY(0);
        }

        .sheet-handle {
            width: 36px;
            height: 4px;
            background: #e5e7eb;
            border-radius: 2px;
            margin: 0 auto 18px;
        }

        .sheet-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 18px;
        }

        .sheet-title {
            font-size: 16px;
            font-weight: 700;
            color: #111827;
        }

        .close-btn {
            width: 30px;
            height: 30px;
            border-radius: 50%;
            background: #f3f4f6;
            border: none;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #6b7280;
            transition: background 0.15s;
        }

        .close-btn:hover { background: #e5e7eb; }

        .close-btn svg {
            width: 14px;
            height: 14px;
            stroke: currentColor;
            fill: none;
            stroke-width: 2.5;
            stroke-linecap: round;
        }

        /* ── Link Preview ── */
        .link-preview {
            background: #f9fafb;
            border: 1px solid #f0f0f0;
            border-radius: 12px;
            padding: 13px;
            display: flex;
            gap: 12px;
            align-items: flex-start;
            margin-bottom: 22px;
        }

        .preview-thumb {
            width: 54px;
            height: 54px;
            border-radius: 10px;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
        }

        .preview-info { flex: 1; min-width: 0; }

        .preview-name {
            font-size: 13px;
            font-weight: 700;
            color: #111827;
            margin-bottom: 2px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .preview-url {
            font-size: 11px;
            color: #059669;
            margin-bottom: 5px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .preview-desc {
            font-size: 11px;
            color: #6b7280;
            line-height: 1.45;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        /* ── Share Options Grid ── */
        .share-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
        }

        .share-btn {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
            cursor: pointer;
            padding: 8px 4px;
            border-radius: 10px;
            background: transparent;
            border: none;
            transition: background 0.15s;
        }

        .share-btn:hover { background: #f9fafb; }
        .share-btn:active { transform: scale(0.92); }

        .share-ico {
            width: 50px;
            height: 50px;
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .share-ico svg { width: 22px; height: 22px; fill: white; }

        .share-name {
            font-size: 10.5px;
            color: #374151;
            font-weight: 500;
            text-align: center;
            line-height: 1.2;
        }

        .ico-copy     { background: #4b5563; }
        .ico-x        { background: #000000; }
        .ico-facebook { background: #1877f2; }
        .ico-whatsapp { background: #25d366; }
        .ico-linkedin { background: #0a66c2; }
        .ico-messenger { background: linear-gradient(135deg, #0099ff 0%, #a033ff 100%); }

        /* ── Toast ── */
        .toast {
            position: fixed;
            bottom: 24px;
            left: 50%;
            transform: translateX(-50%) translateY(10px);
            background: #1f2937;
            color: #f9fafb;
            padding: 10px 20px;
            border-radius: 100px;
            font-size: 13px;
            font-weight: 500;
            z-index: 200;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.25s ease, transform 0.25s ease;
            white-space: nowrap;
            box-shadow: 0 4px 20px rgba(0,0,0,0.4);
        }

        .toast.visible {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }

        /* ── Footer ── */
        .footer {
            text-align: center;
            padding-top: 36px;
            color: rgba(255,255,255,0.25);
            font-size: 11px;
        }

        /* ── Divider ── */
        .divider {
            height: 1px;
            background: linear-gradient(to right, transparent, rgba(52,211,153,0.25), transparent);
            margin: 4px 0 20px;
        }
    </style>
</head>

                    <svg viewBox="0 0 24 24"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413Z"/></svg>
                </div>
                <span class="share-name">WhatsApp</span>
            </button>
            <button class="share-btn" data-platform="linkedin">
                <div class="share-ico ico-linkedin">
                    <svg viewBox="0 0 24 24"><path d="M20.447 20.452h-3.554v-5.569c0-1.328-.027-3.037-1.852-3.037-1.853 0-2.136 1.445-2.136 2.939v5.667H9.351V9h3.414v1.561h.046c.477-.9 1.637-1.85 3.37-1.85 3.601 0 4.267 2.37 4.267 5.455v6.286zM5.337 7.433c-1.144 0-2.063-.926-2.063-2.065 0-1.138.92-2.063 2.063-2.063 1.14 0 2.064.925 2.064 2.063 0 1.139-.925 2.065-2.064 2.065zm1.782 13.019H3.555V9h3.564v11.452zM22.225 0H1.771C.792 0 0 .774 0 1.729v20.542C0 23.227.792 24 1.771 24h20.451C23.2 24 24 23.227 24 22.271V1.729C24 .774 23.2 0 22.222 0h.003z"/></svg>
                </div>
                <span class="share-name">LinkedIn</span>
            </button>
            <button class="share-btn" data-platform="messenger">
                <div class="share-ico ico-messenger">
                    <svg viewBox="0 0 24 24"><path d="M12 0C5.374 0 0 4.975 0 11.111c0 3.498 1.744 6.614 4.469 8.652V24l4.088-2.242c1.092.3 2.246.464 3.443.464 6.626 0 12-4.975 12-11.111C24 4.975 18.626 0 12 0zm1.191 14.963l-3.055-3.26-5.963 3.26L10.732 8l3.131 3.259L19.752 8l-6.561 6.963z"/></svg>
                </div>
                <span class="share-name">Messenger</span>
            </button>
        </div>
    </div>
</div>

<!-- Toast -->
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
    const ICONS = {
        portfolio: `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="26" height="26"><rect x="2" y="7" width="20" height="14" rx="2"/><path d="M16 7V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v2"/><line x1="12" y1="12" x2="12" y2="12"/><path d="M12 12h.01"/><path d="M2 12h8"/><path d="M14 12h8"/></svg>`,
        github: `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="white" width="26" height="26"><path d="M12 2C6.477 2 2 6.477 2 12c0 4.418 2.865 8.166 6.839 9.489.5.092.682-.217.682-.482 0-.237-.009-.868-.013-1.703-2.782.604-3.369-1.342-3.369-1.342-.454-1.154-1.11-1.462-1.11-1.462-.908-.62.069-.608.069-.608 1.003.07 1.531 1.03 1.531 1.03.892 1.529 2.341 1.088 2.91.832.092-.647.35-1.088.636-1.338-2.22-.253-4.555-1.11-4.555-4.943 0-1.091.39-1.984 1.029-2.683-.103-.253-.446-1.27.098-2.647 0 0 .84-.269 2.75 1.025A9.578 9.578 0 0 1 12 6.836a9.59 9.59 0 0 1 2.504.337c1.909-1.294 2.747-1.025 2.747-1.025.546 1.377.202 2.394.1 2.647.64.699 1.028 1.592 1.028 2.683 0 3.842-2.339 4.687-4.566 4.935.359.309.678.919.678 1.852 0 1.336-.012 2.415-.012 2.743 0 .267.18.578.688.48C19.138 20.163 22 16.418 22 12c0-5.523-4.477-10-10-10z"/></svg>`,
        instagram: `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="white" width="26" height="26"><path d="M12 2.163c3.204 0 3.584.012 4.85.07 3.252.148 4.771 1.691 4.919 4.919.058 1.265.069 1.645.069 4.849 0 3.205-.012 3.584-.069 4.849-.149 3.225-1.664 4.771-4.919 4.919-1.266.058-1.644.07-4.85.07-3.204 0-3.584-.012-4.849-.07-3.26-.149-4.771-1.699-4.919-4.92-.058-1.265-.07-1.644-.07-4.849 0-3.204.013-3.583.07-4.849.149-3.227 1.664-4.771 4.919-4.919 1.266-.057 1.645-.069 4.849-.069zm0-2.163c-3.259 0-3.667.014-4.947.072-4.358.2-6.78 2.618-6.98 6.98-.059 1.281-.073 1.689-.073 4.948 0 3.259.014 3.668.072 4.948.2 4.358 2.618 6.78 6.98 6.98 1.281.058 1.689.072 4.948.072 3.259 0 3.668-.014 4.948-.072 4.354-.2 6.782-2.618 6.979-6.98.059-1.28.073-1.689.073-4.948 0-3.259-.014-3.667-.072-4.947-.196-4.354-2.617-6.78-6.979-6.98-1.281-.059-1.69-.073-4.949-.073zm0 5.838c-3.403 0-6.162 2.759-6.162 6.162s2.759 6.163 6.162 6.163 6.162-2.759 6.162-6.163c0-3.403-2.759-6.162-6.162-6.162zm0 10.162c-2.209 0-4-1.79-4-4 0-2.209 1.791-4 4-4s4 1.791 4 4c0 2.21-1.791 4-4 4zm6.406-11.845c-.796 0-1.441.645-1.441 1.44s.645 1.44 1.441 1.44c.795 0 1.439-.645 1.439-1.44s-.644-1.44-1.439-1.44z"/></svg>`
    };

    const LINKS = [
        {
            id: 1,
            title: "Portfolio",
            url: "",
            label: "Portfolio",
            icon: "portfolio",
            bg: "linear-gradient(135deg, #6366f1 0%, #4f46e5 100%)",
            desc: "Check out my portfolio projects."
        },
        {
            id: 2,
            title: "GitHub",
            url: "https://github.com/Pais0925",
            label: "GitHub",
            icon: "github",
            bg: "linear-gradient(135deg, #374151 0%, #111827 100%)",
            desc: "Follow my open source work on GitHub."
        },
        {
            id: 3,
            title: "Instagram",
            url: "https://www.instagram.com/psalrmdn__/",
            label: "Instagram",
            icon: "instagram",
            bg: "linear-gradient(135deg, #f58529 0%, #dd2a7b 50%, #8134af 100%)",
            desc: "Follow me on Instagram."
        }
    ];

    const SHARE_URLS = {
        twitter:   (url, title) => `https://twitter.com/intent/tweet?text=${encodeURIComponent(title)}&url=${encodeURIComponent(url)}`,
        facebook:  (url)        => `https://www.facebook.com/sharer/sharer.php?u=${encodeURIComponent(url)}`,
        whatsapp:  (url, title) => `https://wa.me/?text=${encodeURIComponent(title + ' ' + url)}`,
        linkedin:  (url)        => `https://www.linkedin.com/sharing/share-offsite/?url=${encodeURIComponent(url)}`,
        messenger: (url)        => `https://www.facebook.com/dialog/send?link=${encodeURIComponent(url)}&app_id=291494414550779`
    };

    let activeLink = null;

    /* ── Render cards ── */
    function renderCards() {
        const container = document.getElementById('linksContainer');
        container.innerHTML = LINKS.map(link => `
            <div class="link-card" onclick="handleCardClick('${link.url}')" role="link" tabindex="0"
                 onkeydown="if(event.key==='Enter') handleCardClick('${link.url}')">
                <div class="link-thumb" style="background: ${link.bg};">${ICONS[link.icon] || ''}</div>
                <div class="link-info">
                    <div class="link-title">${link.title}</div>
                    ${link.label ? `<span class="link-label">${link.label}</span>` : ''}
                </div>
                <button class="menu-btn" onclick="openShare(event, ${link.id})" aria-label="Share ${link.title}">
                    <svg viewBox="0 0 24 24">
                        <circle cx="12" cy="5" r="1.8"/>
                        <circle cx="12" cy="12" r="1.8"/>
                        <circle cx="12" cy="19" r="1.8"/>
                    </svg>
                </button>
            </div>
        `).join('');
    }

    function handleCardClick(url) {
        if (url) window.open(url, '_blank', 'noopener,noreferrer');
    }

    /* ── Share modal ── */
    function openShare(event, linkId) {
        event.stopPropagation();
        activeLink = LINKS.find(l => l.id === linkId);
        if (!activeLink) return;

        document.getElementById('previewThumb').innerHTML =
            `<div style="width:54px;height:54px;border-radius:10px;background:${activeLink.bg};display:flex;align-items:center;justify-content:center;">${ICONS[activeLink.icon] || ''}</div>`;
        document.getElementById('previewName').textContent = activeLink.title;
        document.getElementById('previewUrl').textContent = activeLink.url || '(no link yet)';
        document.getElementById('previewDesc').textContent = activeLink.desc || '';

        document.getElementById('overlay').classList.add('open');
        document.body.style.overflow = 'hidden';
    }

    function closeModal() {
        document.getElementById('overlay').classList.remove('open');
        document.body.style.overflow = '';
        activeLink = null;
    }

    /* ── Copy link ── */
    document.getElementById('copyBtn').addEventListener('click', () => {
        if (!activeLink) return;
        const copy = txt => {
            const el = document.createElement('textarea');
            el.value = txt;
            el.style.cssText = 'position:fixed;opacity:0';
            document.body.appendChild(el);
            el.select();
            document.execCommand('copy');
            document.body.removeChild(el);
        };
        (navigator.clipboard ? navigator.clipboard.writeText(activeLink.url).catch(() => copy(activeLink.url)) : Promise.resolve(copy(activeLink.url)))
            .finally(() => { showToast('Link copied!'); closeModal(); });
    });

    /* ── Platform share buttons ── */
    document.querySelectorAll('.share-btn[data-platform]').forEach(btn => {
        btn.addEventListener('click', () => {
            if (!activeLink) return;
            const platform = btn.dataset.platform;
            const builder  = SHARE_URLS[platform];
            if (builder) {
                window.open(builder(activeLink.url, activeLink.title), '_blank', 'noopener,noreferrer');
                closeModal();
            }
        });
    });

    /* ── Close modal on overlay click / close button ── */
    document.getElementById('overlay').addEventListener('click', e => {
        if (e.target === document.getElementById('overlay')) closeModal();
    });
    document.getElementById('closeBtn').addEventListener('click', closeModal);

    /* ── Escape key ── */
    document.addEventListener('keydown', e => {
        if (e.key === 'Escape') closeModal();
    });

    /* ── Toast ── */
    let toastTimer;
    function showToast(msg) {
        const t = document.getElementById('toast');
        t.textContent = msg;
        t.classList.add('visible');
        clearTimeout(toastTimer);
        toastTimer = setTimeout(() => t.classList.remove('visible'), 2400);
    }

    renderCards();
</script>
</body>
</html>
